<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de devis d'entretien — Pyrénées Énergies Solutions</title>
<style>
:root {
  --bleu-profond: #123B5D;
  --bleu-energie: #1E6FA8;
  --turquoise: #2A9D8F;
  --vert: #5FAF5B;
  --gris-fonce: #1C2833;
  --gris-clair: #F2F6F8;
  --blanc: #FFFFFF;
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
  background: var(--gris-clair);
  color: var(--gris-fonce);
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
  line-height: 1.5;
}
header {
  background: var(--bleu-profond);
  color: var(--blanc);
  padding: 1.5rem 1rem;
  border-radius: 12px;
  margin-bottom: 1.5rem;
  text-align: center;
}
header .logo {
  max-height: 80px;
  margin-bottom: 0.6rem;
  background: white;
  padding: 4px;
  border-radius: 8px;
}
header h1 {
  margin: 0.3rem 0 0.2rem;
  font-size: 1.6rem;
  font-weight: 700;
}
header .signature {
  margin: 0;
  font-size: 0.95rem;
  opacity: 0.9;
  font-weight: 400;
}
fieldset {
  background: var(--blanc);
  border: 1px solid #d0d7de;
  border-radius: 10px;
  margin: 1rem 0;
  padding: 1rem;
}
legend {
  font-weight: 700;
  color: var(--bleu-profond);
  padding: 0 0.5rem;
}
label { display: block; margin: 0.6rem 0; }
input, select {
  padding: 0.5rem;
  width: 100%;
  max-width: 320px;
  border: 1px solid #c8d0d6;
  border-radius: 6px;
  font-size: 1rem;
}
button {
  background: var(--bleu-energie);
  color: var(--blanc);
  border: none;
  padding: 0.65rem 1.3rem;
  margin: 0.5rem 0.5rem 0.5rem 0;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: #155a8a; }
button.secondary { background: var(--turquoise); }
button.danger { background: #c0392b; }
.ligne {
  background: var(--blanc);
  border: 1px solid #d0d7de;
  border-radius: 10px;
  padding: 1rem;
  margin: 1rem 0;
}
.total { font-weight: 700; font-size: 1.15rem; color: var(--bleu-profond); }
.mode-badge {
  background: var(--blanc);
  color: var(--bleu-profond);
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  display: inline-block;
  font-weight: 600;
  border: 1px solid #d0d7de;
}
h2 { color: var(--bleu-profond); margin-top: 1.8rem; }
.table-wrapper { overflow-x: auto; margin: 1rem 0; }
table {
  background: var(--blanc);
  border-radius: 8px;
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
  font-size: 0.9rem;
}
th, td {
  padding: 8px 6px;
  text-align: center;
  white-space: nowrap;
  border: 1px solid #d0d7de;
}
th { background: var(--bleu-profond); color: var(--blanc); font-weight: 600; }
td:first-child { text-align: left; white-space: normal; min-width: 180px; }
.field-hidden { display: none; }
.photos { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed #d0d7de; }
.photo-preview { max-width: 120px; max-height: 90px; margin: 0.3rem 0.5rem 0.3rem 0; border-radius: 6px; border: 1px solid #ccc; }
.alerte {
  margin: 0.6rem 0;
  padding: 0.5rem 0.8rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
}
.alerte.ok { background: #e8f5e9; color: #2e7d32; }
.alerte.warning { background: #fff3e0; color: #ef6c00; }
.alerte.overdue { background: #ffebee; color: #c62828; }
</style>
</head>
<body>
<header>
  <img class="logo" src="https://pyrenees-energies-solutions.fr/wp-content/uploads/2026/09/cropped-ChatGPT-Image-2-sept.-2026-15_19_03.png" alt="Logo Pyrénées Énergies Solutions">
  <h1>Pyrénées Énergies Solutions</h1>
  <p class="signature">L’énergie au cœur de votre maison.</p>
</header>

<h2>Simulateur de devis d'entretien</h2>
<p id="mode-badge" class="mode-badge">Mode : non choisi</p>

<fieldset>
<legend>Mode de devis</legend>
<label><input type="radio" name="mode" value="invite" checked> Mode invité (sans données client)</label>
<label><input type="radio" name="mode" value="client"> Avec nom du client</label>
<label><input type="radio" name="mode" value="visiteur"> Mode visiteur (formulaire client sur site)</label>
</fieldset>

<fieldset id="bloc-client" style="display:none">
<legend>Client</legend>
<label>Nom <input id="client-nom" type="text"></label>
<label>Téléphone <input id="client-tel" type="tel"></label>
<label>Email <input id="client-email" type="email"></label>
<label>Adresse <input id="client-adresse" type="text"></label>
</fieldset>

<h2>Appareils</h2>
<div id="lignes"></div>
<button onclick="ajouterLigne()">+ Ajouter un appareil</button>

<h2>Devis</h2>
<div id="resultat"></div>
<button onclick="calculer()">Calculer le devis</button>
<button onclick="envoyer()">Envoyer le devis</button>

<script>
const TARIFS = {
  "clim-mono": { lib: "Clim monosplit", prixTTC: 130, tva: 0.20 },
  "clim-multi": { lib: "Clim multisplit", prixTTC: 180, tva: 0.20 },
  "pac-air-air": { lib: "PAC air-air", prixTTC: 175, tva: 0.20 },
  "pac-air-eau": { lib: "PAC air-eau", prixTTC: 225, tva: 0.20 },
  "solaire": { lib: "Panneaux solaires", prixTTC: 15, tva: 0.055, unitaire: true },
  "ballon": { lib: "Ballon eau chaude", prixTTC: 175, tva: 0.20 }
};

let ligneId = 0;

document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener('change', () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    document.getElementById('bloc-client').style.display = mode === 'invite' ? 'none' : 'block';
    document.getElementById('mode-badge').textContent = 'Mode : ' + mode;
  });
});

function toggleFields(id) {
  const type = document.getElementById('type-' + id).value;
  const isClimPac = type.startsWith('clim') || type.startsWith('pac');
  const isBallon = type === 'ballon';
  const isSolaire = type === 'solaire';
  document.getElementById('puissance-wrap-' + id).classList.toggle('field-hidden', !isClimPac);
  document.getElementById('ballon-wrap-' + id).classList.toggle('field-hidden', !isBallon);
  document.getElementById('solaire-wrap-' + id).classList.toggle('field-hidden', !isSolaire);
}

function previewPhoto(input, previewId) {
  const preview = document.getElementById(previewId);
  preview.innerHTML = '';
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'photo-preview';
      preview.appendChild(img);
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function calculerAlerte(annee) {
  if (!annee || annee < 2000) return { text: 'Année non renseignée', level: 'warning', nextYear: null };
  const currentYear = new Date().getFullYear();
  const age = currentYear - annee;
  const nextYear = annee + Math.floor(age) + 1;
  let text = '';
  let level = 'ok';

  if (age <= 0) {
    text = `Équipement récent (${annee}). Prochain entretien conseillé en ${nextYear}.`;
    level = 'ok';
  } else if (age === 1) {
    text = `Installé en ${annee}. Entretien annuel recommandé cette année (${currentYear}).`;
    level = 'warning';
  } else {
    const enRetard = age > 1;
    text = `Installé en ${annee} (${age} ans). Entretien annuel recommandé. Prochaine échéance : ${nextYear}.`;
    level = enRetard ? 'overdue' : 'warning';
  }
  return { text, level, nextYear, age };
}

function updateAlerte(id) {
  const annee = parseInt(document.getElementById('annee-' + id).value);
  const alerteDiv = document.getElementById('alerte-' + id);
  const info = calculerAlerte(annee);
  alerteDiv.className = 'alerte ' + info.level;
  alerteDiv.textContent = '⚠️ ' + info.text;
  alerteDiv.dataset.nextYear = info.nextYear || '';
  alerteDiv.dataset.level = info.level;
}

function ajouterLigne() {
  const id = ++ligneId;
  const div = document.createElement('div');
  div.className = 'ligne';
  div.id = 'ligne-' + id;
  div.innerHTML = `
    <label>Type <select id="type-${id}" onchange="toggleFields(${id})">
      <option value="clim-mono">Clim monosplit</option>
      <option value="clim-multi">Clim multisplit</option>
      <option value="pac-air-air">PAC air-air</option>
      <option value="pac-air-eau">PAC air-eau</option>
      <option value="solaire">Panneaux solaires</option>
      <option value="ballon">Ballon eau chaude</option>
    </select></label>
    <label>Année d'installation <input id="annee-${id}" type="number" min="2000" max="2030" value="2020" oninput="updateAlerte(${id})"></label>
    <div id="alerte-${id}" class="alerte"></div>
    <label>Installé par moi <input id="parmoi-${id}" type="checkbox"></label>

    <div id="puissance-wrap-${id}">
      <label>Puissance (kW) <input id="puissance-${id}" type="number" step="0.1" min="0" placeholder="ex: 3.5"></label>
    </div>

    <div id="ballon-wrap-${id}" class="field-hidden">
      <label>Type de ballon
        <select id="type-ballon-${id}">
          <option value="thermodynamique">Thermodynamique</option>
          <option value="electrique">Électrique</option>
          <option value="solaire">Solaire</option>
          <option value="autre">Autre</option>
        </select>
      </label>
      <label>Litrage (L) <input id="litrage-${id}" type="number" min="50" max="500" placeholder="ex: 200"></label>
    </div>

    <div id="solaire-wrap-${id}" class="field-hidden">
      <label>Nombre de panneaux <input id="panneaux-${id}" type="number" min="0"></label>
      <label>Autoconsommation / Revente <select id="mode-solaire-${id}">
        <option value="">—</option>
        <option value="auto">Autoconsommation</option>
        <option value="revente">Revente</option>
      </select></label>
    </div>

    <div class="photos">
      <strong>Photos de l'équipement</strong>
      <label>Installation intérieure <input id="photo-int-${id}" type="file" accept="image/*" onchange="previewPhoto(this, 'preview-int-${id}')"></label>
      <div id="preview-int-${id}"></div>
      <label>Installation extérieure <input id="photo-ext-${id}" type="file" accept="image/*" onchange="previewPhoto(this, 'preview-ext-${id}')"></label>
      <div id="preview-ext-${id}"></div>
      <label>Fiche collée / étiquette <input id="photo-fiche-${id}" type="file" accept="image/*" onchange="previewPhoto(this, 'preview-fiche-${id}')"></label>
      <div id="preview-fiche-${id}"></div>
    </div>

    <button class="danger" onclick="document.getElementById('ligne-${id}').remove()">Supprimer</button>
  `;
  document.getElementById('lignes').appendChild(div);
  toggleFields(id);
  updateAlerte(id);
}

function calculer() {
  const lignes = document.querySelectorAll('.ligne');
  let html = '<div class="table-wrapper"><table>';
  html += '<tr><th>Appareil</th><th>Alerte</th><th>Qté</th><th>PU TTC</th><th>Total HT</th><th>TVA</th><th>TTC</th></tr>';
  let totalHT = 0, totalTVA = 0, totalTTC = 0;
  lignes.forEach(div => {
    const id = div.id.split('-')[1];
    const type = document.getElementById('type-' + id).value;
    const t = TARIFS[type];
    let desc = t.lib;
    const qte = type === 'solaire' ? (parseInt(document.getElementById('panneaux-' + id).value) || 0) : 1;

    if (type.startsWith('clim') || type.startsWith('pac')) {
      const kw = document.getElementById('puissance-' + id).value;
      if (kw) desc += ` (${kw} kW)`;
    }
    if (type === 'ballon') {
      const typeB = document.getElementById('type-ballon-' + id).value;
      const lit = document.getElementById('litrage-' + id).value;
      desc += ` — ${typeB}`;
      if (lit) desc += ` ${lit} L`;
    }

    const hasPhotos = document.getElementById('photo-int-' + id).files.length || document.getElementById('photo-ext-' + id).files.length || document.getElementById('photo-fiche-' + id).files.length;
    if (hasPhotos) desc += ' 📷';

    const alerteEl = document.getElementById('alerte-' + id);
    const alerteText = alerteEl ? alerteEl.textContent.replace('⚠️ ', '') : '';
    const alerteLevel = alerteEl ? alerteEl.dataset.level : '';

    const ttcUnitaire = t.prixTTC;
    const ttc = ttcUnitaire * qte;
    const ht = ttc / (1 + t.tva);
    const tva = ttc - ht;

    totalHT += ht; totalTVA += tva; totalTTC += ttc;
    html += `<tr><td>${desc}</td><td class="alerte ${alerteLevel}" style="font-size:0.8rem">${alerteText}</td><td>${qte}</td><td>${ttcUnitaire.toFixed(2)} €</td><td>${ht.toFixed(2)} €</td><td>${tva.toFixed(2)} €</td><td>${ttc.toFixed(2)} €</td></tr>`;
  });
  html += `<tr class="total"><td colspan="4">Total</td><td>${totalHT.toFixed(2)} €</td><td>${totalTVA.toFixed(2)} €</td><td>${totalTTC.toFixed(2)} €</td></tr></table></div>`;
  document.getElementById('resultat').innerHTML = html;
  return { totalHT, totalTVA, totalTTC };
}

function envoyer() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const client = {
    nom: document.getElementById('client-nom')?.value || '',
    tel: document.getElementById('client-tel')?.value || '',
    email: document.getElementById('client-email')?.value || '',
    adresse: document.getElementById('client-adresse')?.value || ''
  };
  const devis = { mode, client, lignes: [], date: new Date().toISOString() };
  document.querySelectorAll('.ligne').forEach(div => {
    const id = div.id.split('-')[1];
    const type = document.getElementById('type-' + id).value;
    const alerteEl = document.getElementById('alerte-' + id);
    devis.lignes.push({
      type,
      annee: document.getElementById('annee-' + id).value,
      parMoi: document.getElementById('parmoi-' + id).checked,
      puissance: document.getElementById('puissance-' + id)?.value || '',
      panneaux: document.getElementById('panneaux-' + id)?.value || '',
      modeSolaire: document.getElementById('mode-solaire-' + id)?.value || '',
      typeBallon: document.getElementById('type-ballon-' + id)?.value || '',
      litrage: document.getElementById('litrage-' + id)?.value || '',
      alerte: {
        text: alerteEl ? alerteEl.textContent : '',
        level: alerteEl ? alerteEl.dataset.level : '',
        nextYear: alerteEl ? alerteEl.dataset.nextYear : ''
      },
      photos: {
        int: document.getElementById('photo-int-' + id).files[0]?.name || '',
        ext: document.getElementById('photo-ext-' + id).files[0]?.name || '',
        fiche: document.getElementById('photo-fiche-' + id).files[0]?.name || ''
      }
    });
  });
  alert('Devis prêt à envoyer. L\'alerte d\'entretien est conservée dans les données pour le compte rendu d\'intervention.');
  console.log(JSON.stringify(devis, null, 2));
}

ajouterLigne();
</script>
</body>
</html>
